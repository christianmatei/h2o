dependencies:
  build:
    - ruby
    - ruby-bundler
    - ruby-dev
    - ruby-tzinfo
    - yaml-dev
    - libpq-dev
  runtime:
    - bash
    - curl
    - jq
    - ca-certificates
    - s6
    - ruby
    - ruby-bundler
    - ruby-tzinfo
    - ruby-rdoc
    - libpq
    - h2o-openrc

stack: alpine/3.19

build:
  command: |
    bundle config set deployment 'true'
    bundle config set without 'development test'

    bundle install

    bundle exec rails assets:precompile
  destinations:
    - '*'
    - .bundle

run:
  commands:
    - binary: rails
      call: db:migrate
      name: migrate
    - binary: rails
      call: console
      name: console
    - binary: tail
      call: -f -n 100 /var/log/h2o/current
      name: logs
      path: /usr/bin
  name: h2o
  services:
    - binary: rails
      name: web
      start:
        call: server

hook:
  post-deinstall: |
    rc-service h2o stop
    rc-update del h2o
  post-install: |
    rc-update add h2o
    rc-service h2o migrate
  post-upgrade: |
    rc-service h2o migrate
    rc-service h2o start
  pre-upgrade: |
    rc-service h2o stop

kits:
  - description: web service
    main: true
    name: web
    ports:
      - main: true
        name: web
        target: 3000
    variables:
      - default_value: production
        key: RAILS_ENV
      - default_value: '1'
        key: RAILS_SERVE_STATIC_FILES
      - driver: generic/secret
        driver_options:
          length: 128
        key: SECRET_KEY_BASE
      - driver: database/postgresql
        key: DATABASE
